name: Android Debug Build

# Builds the SpaceMuse AI Android app entirely on GitHub's runners, since
# the local dev machine cannot run Android Studio / the Android SDK. No
# Gradle wrapper is checked into android/ (see android/README.md), so this
# workflow installs Gradle directly via gradle/actions/setup-gradle instead
# of calling ./gradlew.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spacemuse-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
